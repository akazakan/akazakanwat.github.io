<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StrikeZone - Ultra Stable</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        /* カメラ映像（背景） */
        #webcam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        /* 録画用キャンバス（非表示） */
        #recordCanvas { display: none; }

        /* 操作UI */
        .top-ui {
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(0,0,0,0.8); padding: 5px 0; z-index: 100;
        }
        .slider-group { display: flex; align-items: center; color: white; width: 94%; margin: 5px auto; }
        .slider-group span { width: 80px; font-size: 11px; }
        input[type=range] { flex: 1; height: 30px; }

        #reset-btn {
            position: fixed; top: 130px; left: 15px; z-index: 100;
            background: #444; color: white; border: 1px solid white;
            padding: 8px 15px; border-radius: 8px; font-size: 12px;
        }

        /* ストライクゾーン（CSSで描画） */
        #zone-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1000px; pointer-events: none;
        }
        #strike-zone {
            position: relative; width: 180px; height: 250px;
            background: rgba(255, 255, 0, 0.2); border: 4px solid #ffff00;
            box-sizing: border-box; pointer-events: auto; transform-style: preserve-3d;
        }
        .line { position: absolute; background: rgba(255,255,0,0.4); }
        .v { width: 2px; height: 100%; } .h { height: 2px; width: 100%; }

        /* 録画ボタン */
        .bottom-ui { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; width: 80%; }
        #rec-btn, #stop-btn { width: 100%; padding: 20px; border: none; border-radius: 50px; font-weight: bold; color: white; font-size: 18px; }
        #rec-btn { background: red; } #stop-btn { background: #555; display: none; }

        /* プレビュー表示 */
        #preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: none; flex-direction: column;
        }
        #preview-video { width: 100%; flex: 1; }
        .preview-controls { display: flex; padding: 20px; gap: 10px; background: #222; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="recordCanvas"></canvas>

    <div class="top-ui">
        <div class="slider-group"><span>サイズ</span>
            <input type="range" id="wS" min="50" max="450" value="180">
            <input type="range" id="hS" min="50" max="600" value="250">
        </div>
        <div class="slider-group"><span>左右スライド</span><input type="range" id="skewX" min="-60" max="60" value="0"></div>
        <div class="slider-group"><span>真横に回転</span><input type="range" id="rotY" min="-180" max="180" value="0"></div>
    </div>

    <button id="reset-btn" onclick="resetSettings()">リセット</button>

    <div id="zone-container">
        <div id="strike-zone">
            <div class="line v" style="left:33%"></div><div class="line v" style="left:66%"></div>
            <div class="line h" style="top:33%"></div><div class="line h" style="top:66%"></div>
        </div>
    </div>

    <div class="bottom-ui">
        <button id="rec-btn" onclick="startRecording()">録画開始</button>
        <button id="stop-btn" onclick="stopRecording()">録画終了</button>
    </div>

    <div id="preview-container">
        <video id="preview-video" controls playsinline></video>
        <div class="preview-controls">
            <button onclick="closePreview()" style="background:#666; padding:15px; border:none; border-radius:10px; color:white; flex:1;">やり直し</button>
            <button onclick="saveVideo()" style="background:#28a745; padding:15px; border:none; border-radius:10px; color:white; flex:1;">保存</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const zone = document.getElementById('strike-zone');
        const canvas = document.getElementById('recordCanvas');
        const ctx = canvas.getContext('2d');
        
        let posX = 0, posY = 0, sX = 0, rY = 0, zW = 180, zH = 250;
        let mediaRecorder, chunks = [];

        // カメラ起動（エラー対策強化）
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("カメラの起動に失敗しました。設定でカメラ権限を許可してください。");
            }
        }
        initCamera();

        function updateZone() {
            zone.style.width = zW + 'px';
            zone.style.height = zH + 'px';
            zone.style.transform = `translate(${posX}px, ${posY}px) skewX(${sX}deg) rotateY(${rY}deg)`;
        }

        function resetSettings() {
            posX = 0; posY = 0; sX = 0; rY = 0; zW = 180; zH = 250;
            document.getElementById('wS').value = 180; document.getElementById('hS').value = 250;
            document.getElementById('skewX').value = 0; document.getElementById('rotY').value = 0;
            updateZone();
        }

        document.getElementById('wS').oninput = e => { zW = e.target.value; updateZone(); };
        document.getElementById('hS').oninput = e => { zH = e.target.value; updateZone(); };
        document.getElementById('skewX').oninput = e => { sX = e.target.value; updateZone(); };
        document.getElementById('rotY').oninput = e => { rY = e.target.value; updateZone(); };

        document.addEventListener('touchmove', e => {
            if(e.target.closest('.top-ui') || e.target.closest('.bottom-ui') || e.target.id === 'reset-btn') return;
            const t = e.touches[0];
            posX = t.clientX - window.innerWidth / 2;
            posY = t.clientY - window.innerHeight / 2;
            updateZone();
        }, { passive: false });

        // 録画中の描画処理（最もシンプルな方式）
        function drawLoop() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                
                ctx.save();
                ctx.translate(canvas.width/2 + posX, canvas.height/2 + posY);
                ctx.transform(1, 0, Math.tan(sX * Math.PI / 180), 1, 0, 0);
                ctx.scale(Math.abs(Math.cos(rY * Math.PI / 180)), 1);
                ctx.strokeStyle = "yellow"; ctx.lineWidth = 6;
                ctx.strokeRect(-zW/2, -zH/2, zW, zH);
                ctx.fillStyle = "rgba(255,255,0,0.2)"; ctx.fillRect(-zW/2, -zH/2, zW, zH);
                ctx.restore();
                
                requestAnimationFrame(drawLoop);
            }
        }

        function startRecording() {
            chunks = [];
            const stream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const preview = document.getElementById('preview-video');
                preview.src = url;
                // 読み込み完了後に表示
                preview.onloadeddata = () => {
                    document.getElementById('preview-container').style.display = 'flex';
                };
            };
            mediaRecorder.start();
            drawLoop();
            document.getElementById('rec-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';
        }

        function stopRecording() {
            mediaRecorder.stop();
            document.getElementById('rec-btn').style.display = 'block';
            document.getElementById('stop-btn').style.display = 'none';
        }

        function closePreview() { document.getElementById('preview-container').style.display = 'none'; }
        function saveVideo() {
            const a = document.createElement('a');
            a.href = document.getElementById('preview-video').src;
            a.download = `strike_${Date.now()}.webm`;
            a.click();
        }
    </script>
</body>
</html>
